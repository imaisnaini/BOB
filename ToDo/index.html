<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind config for brand colors -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                blue: "#1D4ED8",
                "blue-light": "#3B82F6",
                "blue-bg": "#EFF6FF",
                orange: "#F97316",
                "orange-light": "#FDBA74",
              },
            },
          },
        },
      };
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-brand-blue-bg min-h-screen font-sans antialiased">

    <!-- ===== PAGE WRAPPER ===== -->
    <div class="max-w-2xl mx-auto px-4 py-10">

      <!-- ===== HEADER ===== -->
      <header class="mb-8 text-center">
        <div class="flex items-center justify-center gap-2 mb-1">
          <!-- Checklist icon (inline SVG) -->
          <svg class="w-8 h-8 text-brand-blue" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697A9 9 0 1 0 20.303 16.165" />
          </svg>
          <h1 class="text-3xl font-bold text-brand-blue tracking-tight">Task List</h1>
        </div>
        <p class="text-sm text-slate-500">Stay organised. Stay focused.</p>
      </header>

      <!-- ===== CARD CONTAINER ===== -->
      <main class="bg-white rounded-2xl shadow-card overflow-hidden">

        <!-- ----- Add Task Form ----- -->
        <section class="p-5 border-b border-slate-100" aria-label="Add new task">
          <form id="task-form" class="flex gap-2" novalidate>
            <input
              id="task-input"
              type="text"
              maxlength="150"
              placeholder="Add a new task…"
              class="flex-1 rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-700 placeholder-slate-400 outline-none focus:border-brand-blue-light focus:ring-2 focus:ring-brand-blue-light/20 transition"
              aria-label="New task title"
            />
            <button
              type="submit"
              class="btn-add flex items-center gap-1.5 bg-brand-blue text-white text-sm font-semibold px-5 py-2.5 rounded-xl hover:bg-brand-blue-light active:scale-95 transition-all"
            >
              <!-- Plus icon -->
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              Add
            </button>
          </form>
          <!-- Validation message -->
          <p id="validation-msg" class="hidden mt-2 text-xs text-red-500" role="alert"></p>
        </section>

        <!-- ----- Filter Tabs ----- -->
        <section class="px-5 pt-4 pb-2 flex gap-1" aria-label="Filter tasks">
          <button data-filter="all"       class="filter-btn filter-btn--active">All</button>
          <button data-filter="active"    class="filter-btn">Active</button>
          <button data-filter="completed" class="filter-btn">Completed</button>
        </section>

        <!-- ----- Task List ----- -->
        <section aria-label="Task list">
          <ul id="task-list" class="divide-y divide-slate-100 px-2 pb-2"></ul>

          <!-- Empty state -->
          <div id="empty-state" class="hidden flex-col items-center justify-center py-14 text-slate-400 text-sm gap-2">
            <svg class="w-10 h-10 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 0 2-2h2a2 2 0 0 0 2 2" />
            </svg>
            <p id="empty-msg">No tasks yet. Add one above!</p>
          </div>
        </section>

        <!-- ----- Footer Stats ----- -->
        <footer class="px-5 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400" aria-label="Task summary">
          <span id="active-count">0 task left</span>
          <button id="clear-completed-btn" class="hidden text-brand-orange hover:text-orange-500 font-medium transition-colors">
            Clear completed
          </button>
        </footer>
      </main>

    </div><!-- /page wrapper -->

    <!-- ===== EDIT MODAL ===== -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <h2 id="modal-title" class="text-base font-semibold text-slate-700 mb-3">Edit Task</h2>
        <input
          id="modal-input"
          type="text"
          maxlength="150"
          class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-700 outline-none focus:border-brand-blue-light focus:ring-2 focus:ring-brand-blue-light/20 transition mb-4"
          aria-label="Edit task title"
        />
        <div class="flex justify-end gap-2">
          <button id="modal-cancel" class="px-4 py-2 text-sm rounded-xl border border-slate-200 text-slate-500 hover:bg-slate-50 transition">Cancel</button>
          <button id="modal-save"   class="px-4 py-2 text-sm rounded-xl bg-brand-blue text-white font-semibold hover:bg-brand-blue-light active:scale-95 transition-all">Save</button>
        </div>
      </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script src="script.js"></script>
  </body>
</html>
